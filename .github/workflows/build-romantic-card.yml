name: Build Romantic Card APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RomanticCardAndroid_v1.zip'
      - '.github/workflows/build-romantic-card.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o RomanticCardAndroid_v1.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug
        working-directory: project/RomanticCardAndroid

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Romantic-Card-APK
          path: project/RomanticCardAndroid/app/build/outputs/apk/debug/app-debug.apk
